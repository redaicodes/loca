name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    name: Contract unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test
        working-directory: contracts/loca

  typescript:
    name: Types and agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm test

  sandbox:
    name: End-to-end loan on a local NEAR node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain and cargo-near
        run: |
          rustup show
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - name: Full loop (order, bids, loan, delivery, repayment, blocked attacks)
        run: pnpm demo:sim
