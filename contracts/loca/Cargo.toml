[package]
name = "loca"
version = "0.1.0"
edition = "2021"
description = "LOCA - Line of Credit for Agents: receivable-backed credit market for AI agents on NEAR"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
